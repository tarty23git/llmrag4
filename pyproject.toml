[project]
name = "llmrag4"
version = "0.1.0"
description = "Retrieval-augmented generation app: hybrid local search + Claude answers with citations"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.7.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "rank-bm25>=0.2.2",
    "fastembed>=0.9.1",
    "numpy>=1.26",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
rag = "rag.cli:main"

[tool.setuptools.packages.find]
include = ["rag*", "app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
